# Production stack for the home server, deployed by devbot as compose project
# "fortuna" (see deploy/README.md). Settings come from the .env next to this
# file; deploy/fortuna.env.example lists them. Service, container and volume
# names match the old Portainer stack so the data carries over.

x-logging: &logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

# Backup decisions for the named volumes (devbot's repo convention). Postgres
# and the statements and inbox folders live under /srv/fortuna.
x-devbot:
  backup:
    parser-sandbox-queue: "none: transient job files between file-parser and the sandbox worker"
    chat-credentials: "none: per-user Codex sign-in tokens, kept out of backups; users reconnect in the app"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fortuna-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-personal_finance}
    volumes:
      - ${FORTUNA_DATA_DIR:-/srv/fortuna}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB:-personal_finance}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - finance-network
    logging: *logging

  # Applies pending Prisma migrations, then exits. Everything that talks to the
  # database waits for it.
  migrate:
    build:
      context: ./services/data-service
      target: migrate
    image: fortuna-migrate:${REVISION:-dev}
    restart: "no"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-personal_finance}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - finance-network
    logging: *logging

  file-parser:
    build:
      context: ./services/file-parser
    image: fortuna-file-parser:${REVISION:-dev}
    container_name: fortuna-file-parser
    restart: unless-stopped
    expose:
      - "4000"
    environment:
      - PORT=4000
      - FRONTEND_URL=${NEXTAUTH_URL}
      - DATA_SERVICE_URL=http://data-service:4001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - SANDBOX_QUEUE_DIR=/sandbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    volumes:
      - parser-sandbox-queue:/sandbox
    depends_on:
      parser-sandbox-worker:
        condition: service_started
    networks:
      - finance-network
    logging: *logging

  # Same code as file-parser; runs generated parser code with no network.
  parser-sandbox-worker:
    build:
      context: ./services/file-parser
    image: fortuna-parser-sandbox-worker:${REVISION:-dev}
    container_name: fortuna-parser-sandbox
    restart: unless-stopped
    command: python -m app.sandbox_worker
    network_mode: none
    read_only: true
    cap_drop: ["ALL"]
    cap_add: ["SETUID", "SETGID"]
    security_opt:
      - no-new-privileges:true
    pids_limit: 32
    mem_limit: 768m
    cpus: 1.0
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      - SANDBOX_QUEUE_DIR=/sandbox
      - SANDBOX_WALL_TIMEOUT_SECONDS=20
    volumes:
      - parser-sandbox-queue:/sandbox
    # The worker touches this file on every pass of its queue loop.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/sandbox-worker.heartbeat') < 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: *logging

  data-service:
    build:
      context: ./services/data-service
      target: runner
    image: fortuna-data-service:${REVISION:-dev}
    container_name: fortuna-data-service
    restart: unless-stopped
    expose:
      - "4001"
    environment:
      - PORT=4001
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-personal_finance}?schema=public
      - NODE_ENV=production
      - PARSER_SERVICE_URL=http://file-parser:4000
      - CHAT_ENCRYPTION_KEY_V1=${CHAT_ENCRYPTION_KEY_V1:-}
      - CHAT_WORKER_URL=http://chat-worker:4003
      - CHAT_ENABLED=${CHAT_ENABLED:-false}
      - STATEMENT_STORAGE_DIR=/data/statements
      - COMMIT_TOKEN_SECRET=${COMMIT_TOKEN_SECRET}
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
    volumes:
      - ${FORTUNA_DATA_DIR:-/srv/fortuna}/statements:/data/statements
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - finance-network
    logging: *logging

  chat-worker:
    build:
      context: ./services/data-service
      dockerfile: Dockerfile.chat-worker
    image: fortuna-chat-worker:${REVISION:-dev}
    restart: unless-stopped
    init: true
    user: "1000:1000"
    read_only: true
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 128
    mem_limit: 1536m
    cpus: 2.0
    tmpfs: ["/tmp:size=128m,mode=1777"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-personal_finance}?schema=public
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - COMMIT_TOKEN_SECRET=${COMMIT_TOKEN_SECRET}
      - CHAT_ENABLED=${CHAT_ENABLED:-false}
      - CHAT_ENCRYPTION_KEY_V1=${CHAT_ENCRYPTION_KEY_V1:-}
      - CHAT_WORKER_CONCURRENCY=${CHAT_WORKER_CONCURRENCY:-2}
      - PARSER_SERVICE_URL=http://file-parser:4000
      - STATEMENT_STORAGE_DIR=/data/statements
    volumes:
      - chat-credentials:/data/chat-codex
      - ${FORTUNA_DATA_DIR:-/srv/fortuna}/statements:/data/statements
    expose: ["4003"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
    depends_on:
      data-service:
        condition: service_healthy
    networks: [finance-network]
    logging: *logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.frontend
      args:
        SERVER_ACTION_ALLOWED_ORIGINS: ${SERVER_ACTION_ALLOWED_ORIGINS:-fortuna.delishad.com}
    image: fortuna-frontend:${REVISION:-dev}
    container_name: fortuna-frontend
    restart: unless-stopped
    # nginx (fortuna.delishad.com) proxies to this port.
    ports:
      - "127.0.0.1:3040:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-personal_finance}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - AUTH_TRUST_HOST=true
      - PARSER_SERVICE_URL=http://file-parser:4000
      - DATA_SERVICE_URL=http://data-service:4001
      - NODE_ENV=production
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN}
      - REVISION=${REVISION:-dev}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      file-parser:
        condition: service_healthy
      data-service:
        condition: service_healthy
    networks:
      - finance-network
    logging: *logging

  # MCP gateway for Hermes, loopback only.
  finance-mcp:
    build:
      context: ./services/finance-mcp
    image: fortuna-finance-mcp:${REVISION:-dev}
    container_name: fortuna-finance-mcp
    restart: unless-stopped
    ports:
      - "127.0.0.1:4002:4002"
    environment:
      - PORT=4002
      - HOST=0.0.0.0
      - DATA_SERVICE_URL=http://data-service:4001
      - PARSER_SERVICE_URL=http://file-parser:4000
      - FINANCE_API_TOKEN=${FINANCE_API_TOKEN}
      - MCP_CLIENT_TOKEN=${MCP_CLIENT_TOKEN}
      - MCP_ALLOWED_HOSTS=${MCP_ALLOWED_HOSTS:-localhost,127.0.0.1,192.168.1.2}
      - STATEMENT_INBOX=${FORTUNA_DATA_DIR:-/srv/fortuna}/inbox
    volumes:
      - ${FORTUNA_DATA_DIR:-/srv/fortuna}/inbox:${FORTUNA_DATA_DIR:-/srv/fortuna}/inbox:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      data-service:
        condition: service_healthy
      file-parser:
        condition: service_healthy
    networks:
      - finance-network
    logging: *logging

networks:
  finance-network:
    driver: bridge

volumes:
  parser-sandbox-queue:
  chat-credentials:
