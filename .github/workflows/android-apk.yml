name: Build Android test APK

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compile installable APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript and Expo dependencies
        run: |
          npm run typecheck
          npm run check

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Compile test APK
        run: ./android/gradlew -p android assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a

      - name: Name APK
        run: cp android/app/build/outputs/apk/release/app-release.apk Fortuna-test-${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Fortuna-Android-test-${{ github.run_number }}
          path: mobile/Fortuna-test-${{ github.run_number }}.apk
          if-no-files-found: error
          retention-days: 30
