# fortuna.delishad.com
# The web app on 127.0.0.1:3040. The MCP gateway (127.0.0.1:4002) is not proxied.
server {
    set $forward_scheme http;
    set $server "127.0.0.1";
    set $port 3040;

    listen 80;
    listen [::]:80;
    listen 443 ssl http2;
    listen [::]:443 ssl http2;

    server_name fortuna.delishad.com;

    include conf.d/include/geo-enforce.conf;
    include conf.d/include/access-json.conf;
    include conf.d/include/ssl-ciphers.conf;
    ssl_certificate /etc/letsencrypt/live/delishad.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/delishad.com/privkey.pem;
    include conf.d/include/force-ssl.conf;

    access_log /var/log/nginx/fortuna_access.log proxy;
    error_log /var/log/nginx/fortuna_error.log warn;

    # Statement uploads (Server Actions allow 10 MB bodies).
    client_max_body_size 20m;

    location / {
        include conf.d/include/block-exploits.conf;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        include conf.d/include/proxy.conf;
    }
}
